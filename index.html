<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Creative Space</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.1);
            --text-color: #f8fafc;
            --accent: #38bdf8;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0, transparent 50%), 
                radial-gradient(at 100% 100%, rgba(192, 38, 211, 0.15) 0, transparent 50%);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start; /* Изменил, чтобы окна красиво вставали в ряд */
            min-height: 100vh;
            gap: 20px;
            padding: 40px 20px;
        }

        .window {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
            width: 320px;
        }

        .window:hover {
            transform: translateY(-5px);
        }

        /* Окно с видео делаем шире */
        .window.large {
            width: 450px;
        }

        .dots { display: flex; gap: 6px; margin-bottom: 15px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .red { background: #ff5f56; }
        .yellow { background: #ffbd2e; }
        .green { background: #27c93f; }

        h2 { margin-top: 0; color: var(--accent); font-size: 1.2rem; }
        p { font-size: 0.95rem; line-height: 1.5; opacity: 0.9; }

        /* Контейнер для видео */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* Соотношение сторон 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            margin-bottom: 15px;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .contact-btn {
            display: block;
            background: var(--accent);
            color: #000;
            text-decoration: none;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
        }

        .tag {
            display: inline-block;
            background: rgba(255,255,255,0.1);
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 0.8rem;
            margin: 2px;
        }
    </style>
</head>
<body>

    <div class="window large">
        <div class="dots">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
        </div>
        <h2>Мои проекты</h2>
        
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/VhYT_IdYoK4" allowfullscreen></iframe>
        </div>

        <p><strong>Не судить книгу по обложке</strong></p>
        <p style="opacity: 0.7;">Работа выполнена на Scratch. Это мой первый опыт создания логики выбора контента.</p>
        <div class="tag">Scratch</div>
        <div class="tag">GameDev</div>
    </div>

    <div class="window">
        <div class="dots">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
        </div>
        <h2>Связь</h2>
        <p>Звони мне для сотрудничества:</p>
        <a href="tel:+996801379801" class="contact-btn">📞 +996 801 379 801</a>
    </div>

    <div class="window">
        <div class="dots">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
        </div>
        <h2>Terminal.exe</h2>
        <p>> Профиль: Новичок<br>> Локация: Гитхаб<br>> Статус: Создаю крутое...</p>
    </div>

</body>
</html>
